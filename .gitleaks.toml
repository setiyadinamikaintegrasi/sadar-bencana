[extend]
useDefault = true

[[allowlists]]
description = "Truncated Supabase examples in historical README revisions"
targetRules = ["generic-api-key"]
condition = "AND"
commits = [
  "aa770d7e12a270b0092ccb0e953c7b6e9a7df3f4",
  "63c38a689bc15d273c1cef8176409b5b186128df",
]
paths = [
  '''README\.md$''',
]

[[allowlists]]
description = "Email idempotency UUID fixture detected as a generic API key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''apps/worker/tests/alerts/test_email_channel\.py$''',
]
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[allowlists]]
description = "Playwright fixture bearer JWT explicitly prefixed with fixture. in operational map e2e"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''apps/web/e2e/operational-map\.spec\.ts$''',
]
regexes = [
  '''^fixture\.eyJ''',
]
