name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run verify:web-runtime
      - run: npm run verify:brand
      - run: npm run build --workspace apps/web
        env:
          VITE_API_BASE_URL: /api/v1

  mastra:
    name: Mastra typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck --workspace apps/mastra
      - run: npm run build --workspace apps/mastra
        env:
          API_ENV: hosted
          MASTRA_API_TOKEN: ci-mastra-token-0000000000000000
          WORKER_API_TOKEN: ci-worker-token-0000000000000000
          MASTRA_TELEMETRY_DISABLED: '1'
          OPENAI_API_KEY: build-placeholder
          OPENAI_BASE_URL: http://127.0.0.1:11434/v1

  worker:
    name: Python Worker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sadar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sadar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/worker/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sadar_test
